data:
  dataset_name: McAuley-Lab/Amazon-Reviews-2023
  review_config: raw_review_All_Beauty
  meta_config: raw_meta_All_Beauty
  output_dir: data/processed/all_beauty
  max_items: 30000
  min_user_interactions: 5
  min_item_interactions: 2
  cold_item_keep_ratio: 0.15
  max_seq_len: 50
  cold_threshold: 5
  text_model: sentence-transformers/all-MiniLM-L6-v2
  image_model: openai/clip-vit-base-patch32
  use_images: true
  max_image_items: 8000
  image_timeout: 8
  seed: 2025

model:
  hidden_size: 128
  n_layers: 2
  n_heads: 4
  dropout: 0.2
  max_seq_len: 50
  num_experts: 6
  text_dim: 384
  image_dim: 512
  time_dim: 16
  router_hidden: 256
  graph_dim: 64
  graph_layers: 2
  use_text: true
  use_image: true
  use_time: true
  use_cold: true
  use_cross: true
  use_graph: true
  use_id_graph: true
  use_text_graph: true
  use_image_graph: true

train:
  data_dir: data/processed/all_beauty
  batch_size: 256
  epochs: 20
  lr: 0.001
  weight_decay: 0.00001
  num_workers: 2
  eval_topk: [5, 10, 20]
  category_loss_weight: 0.05
  alignment_loss_weight: 0.05
  router_balance_loss_weight: 0.01
  alignment_temperature: 0.2
  num_eval_negatives: 0
  device: cuda
  save_dir: checkpoints/cstamoerec
  seed: 2025
